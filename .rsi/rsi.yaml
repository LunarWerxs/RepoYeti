schema: hydra-rsi/1
# daemon.bundle_bytes: bytes of the minified Bun bundle of the daemon (what bun --compile embeds).
# web.source_bytes: committed bytes of the mobile dashboard (web/src, web/public).
metrics:
  - id: daemon.bundle_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/daemon_bundle_bytes.py"
    pick: 'daemon_bundle_bytes=(\d+)'
    gate: exact
    light: false
  - id: web.source_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'web_bytes=(\d+)'
    gate: exact
    light: true
