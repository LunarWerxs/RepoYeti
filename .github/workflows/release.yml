name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build one self-contained executable
# per OS. The Vue app is embedded in the binary; no web/ or node_modules/ sidecars are released.
#
# NOTE: arch labels below are nominal (ubuntu→x64, macos-latest→arm64). Adjust the matrix /
# `bun build --compile --target` in scripts/build.ts if you need additional arch variants.

on:
  push:
    tags: ["v*"]

  # Manual runs, so a commit or tag can be built without waiting on a webhook. Added 2026-08-06
  # during a GitHub Actions incident whose recovery plan was to THROTTLE webhook triggers: pushes
  # and tag pushes landed and produced no run at all. Dispatching on a TAG ref still satisfies the
  # `github.ref_type == 'tag'` gate on the publish job below, so it is a real release; dispatching
  # on a branch builds and smoke-tests without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

# One release run per ref. GitHub fired TWO identical runs for the v0.21.4 tag push, two seconds
# apart, same SHA. Nothing here is idempotent past the build: both would have reached `gh release
# create` for the same tag and the loser would have gone red on a release that actually published
# fine, which is the worst kind of red — a public failure badge on a good release. `cancel-in-
# progress` is safe precisely because the group is the TAG ref: two runs in one group can only ever
# be duplicates of the same release, never two different ones racing, so the newer is always the one
# to keep. A branch dispatch groups by its own ref and is unaffected.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release must not be publishable from code the test suite rejects. Until this gate existed the
  # Release workflow shared NOTHING with CI: its only build step is `bun run build`, which calls
  # web's `build:fast` — vite alone, no vue-tsc — so a commit whose web typecheck was failing in CI
  # still produced three binaries and published them. That happened on 2026-08-14: the changed-file
  # "View all" control read a store property that was never exposed on the composed store, CI went
  # red on it, and the tag built green regardless. Tagging is precisely the moment nobody is
  # watching a run, so the gate belongs here rather than resting on someone noticing a red badge.
  preflight:
    name: preflight (${{ matrix.os }})
    # The SAME three OSes the build matrix ships, because a release that tests on one of them is a
    # release that tests the wrong one: this is a Windows-first app, and the Windows-only code
    # (the PE GUI-subsystem stamp in scripts/build.ts, detached spawn, the instance pointer, tray
    # host, path handling) plus every `test.skipIf(!isWin)` case never executed in the release path
    # at all. The build matrix compiles all three but runs no tests. Public repo, so hosted runners
    # are free; the only cost is the windows leg's wall-clock, paid once per release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      # The web half is OS-independent (vue-tsc, i18n, jsdom vitest), so it runs once on Linux
      # rather than three times identically.
      - if: runner.os == 'Linux'
        run: bun install --cwd web --frozen-lockfile
      # Deleting a bad release un-publishes the binaries; it does NOT un-tell the fleet. Every
      # install compares the newest published tag against the version compiled into its own binary
      # (github-updater.ts:123-124, against VERSION from config.ts). Tag v0.21.0 on a tree still at
      # 0.20.9 and the downloaded binary keeps reporting 0.20.9, so isNewer() stays true after the
      # update applies and every copy re-updates forever. tests/version-consistency.test.ts already
      # keeps the three in-tree version sites equal; nothing compared them to the tag until now.
      - name: Tag must match the version in the tree
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${packaged}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json ${packaged}"
      - run: bun run typecheck # tsc: the daemon
      - if: runner.os == 'Linux'
        run: bun run --cwd web typecheck # vue-tsc: templates + store surface, what `build:fast` skips
      - run: bun run check
      - if: runner.os == 'Linux'
        run: bun run --cwd web i18n:check
      # Hosted runners ship without a global git identity; the suite makes commits and annotated
      # tags, which need a committer/tagger.
      - name: Configure a git identity
        shell: bash
        run: |
          git config --global user.name "RepoYeti CI"
          git config --global user.email "ci@users.noreply.github.com"
      # check:coverage runs the same suite WITH the overall-% floor, so this is `bun run test` plus
      # the gate, not a second pass. CI applies the floor on every push; without it here a tag could
      # publish under a floor that push-time CI would have refused.
      - run: bun run check:coverage
      - if: runner.os == 'Linux'
        run: bun run --cwd web test

  # The browser gate, same job as CI's (see .github/workflows/ci.yml for what it covers and why).
  # It is here as well as there because tagging is the moment nobody is watching: the three things
  # it checks — a foreign local page cannot drive a write, a reconnecting dashboard converges, and
  # menus open on screen — are all things that shipped broken before, and none of them can be seen
  # by a build or by the unit suites. Linux only: it tests Chromium's behaviour and the dashboard's
  # layout, not the daemon's platform coverage, which is preflight's matrix.
  browser:
    name: browser gate (loopback origin + reconnect + menus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run --cwd web build
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: bun run --cwd web test:gate
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-gate-diagnostics
          path: |
            web/.playwright/browser-gate/daemon.log
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build (${{ matrix.os }})
    # Both gates, not just the suite: a release that publishes past a red browser gate is exactly
    # the case the gate exists for.
    needs: [preflight, browser]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: repoyeti-linux-x64.tar.gz
          - os: macos-latest
            asset: repoyeti-macos-arm64.tar.gz
          - os: windows-latest
            asset: repoyeti-windows-x64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run build
      # Windows code signing, BEFORE any packaging, so all three Windows assets carry the identical
      # signed binary and the single-file archive assertions below still hold.
      #
      # Why it matters here specifically: a browser-downloaded unsigned .exe gets Mark-of-the-Web,
      # so a first-time user meets "Windows protected your PC - Unknown publisher" and has to click
      # through More info -> Run anyway. Explorer propagates MOTW to files extracted from the zips
      # too, and the tray bundle's .ps1 files additionally trip execution policy. SHA256SUMS.txt
      # does not help with any of that: Windows never reads it, and it only proves a file is what
      # this same pipeline uploaded, never who published it. The updater's own integrity story is
      # already strong (pinned URL, checksum-verified, version-verified before the swap), so signing
      # buys nothing THERE - it buys the first download, which is the one that decides whether a
      # stranger runs this at all.
      #
      # ⛔ THIS STEP IS NOT THE PATH IN USE, AND IS OFF. Signing happens on the WORKSTATION, via
      # the Connections vault's `sign_artifact` (Azure Artifact Signing account `lunawerxsigning`,
      # profile `lunawerx-public-trust`), which reads the signing account and endpoint from Azure
      # and leases the credential into SignTool value-blind. That is how v1.0.1's Windows assets
      # were signed: build in CI, sign the downloaded assets locally, repack, regenerate
      # SHA256SUMS.txt, re-upload. See docs/RELEASING.md.
      #
      # The reason it is not done here is deliberate: this step needs AZURE_CLIENT_SECRET as a
      # GitHub Actions secret, and the standing rule is that a secret value never passes through an
      # agent's context on its way there. There is a value-blind bridge for Cloudflare but none for
      # GitHub Actions, so putting it in is a human's job. This step stays, correct and ready, for
      # whenever that happens or a self-hosted Windows runner with the vault exists.
      #
      # Gated on a repository VARIABLE, not a secret, so `if:` can read it: until
      # RY_SIGN_WINDOWS is set to "true" in repo settings, this step is skipped and a release
      # publishes exactly as it does today. A fork never has it, so forks keep building too.
      #
      # Required repo variables: RY_SIGN_WINDOWS, AZURE_SIGNING_ENDPOINT (e.g.
      # https://eus.codesigning.azure.net), AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE.
      # Required repo secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an App
      # Registration granted the "Trusted Signing Certificate Profile Signer" role on the account).
      # Federated (OIDC) credentials work too: drop the client secret, add `id-token: write` to this
      # job's permissions, and run azure/login before this step.
      - name: Sign the Windows binaries (Azure Trusted Signing)
        if: runner.os == 'Windows' && vars.RY_SIGN_WINDOWS == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          # An explicit list, not a folder sweep: dist/ must stay exactly one file (asserted below),
          # and misc/ holds plenty that must not be touched. The tray scripts are signed as well -
          # a signed launcher inside a bundle of unsigned .ps1 files still meets an execution-policy
          # prompt, which reads to a user exactly like the warning signing was meant to remove.
          files: |
            ${{ github.workspace }}\dist\repoyeti.exe
            ${{ github.workspace }}\misc\lunarwerx-tray.exe
            ${{ github.workspace }}\misc\Create-Shortcut.ps1
            ${{ github.workspace }}\misc\New-TrayShortcut.ps1
            ${{ github.workspace }}\misc\Tray-Host.ps1
            ${{ github.workspace }}\misc\RepoYeti-Tray.ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Fail loudly rather than publish an unsigned release that everyone assumed was signed. The
      # signing step above is a no-op when the variable is off; this proves it actually did something
      # when it is on.
      - name: Verify the signature landed
        if: runner.os == 'Windows' && vars.RY_SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("dist/repoyeti.exe", "misc/lunarwerx-tray.exe")) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            if ($sig.Status -ne "Valid") {
              throw "$f is not validly signed after the signing step (status: $($sig.Status))"
            }
            Write-Host "signed: $f  ->  $($sig.SignerCertificate.Subject)"
          }
      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f dist/repoyeti
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          bun run scripts/smoke-release.ts dist
          mkdir -p out
          tar -C dist -czf "out/${{ matrix.asset }}" repoyeti
          listing="$(tar -tzf "out/${{ matrix.asset }}")"
          grep -qx 'repoyeti' <<<"$listing"
          test "$(wc -l <<<"$listing")" -eq 1
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/repoyeti.exe" -PathType Leaf)) {
            throw "no compiled binary found at dist/repoyeti.exe"
          }
          if ((Get-ChildItem -LiteralPath "dist" -Force).Count -ne 1) {
            throw "dist must contain only the self-contained executable"
          }
          bun run scripts/smoke-release.ts dist
          New-Item -ItemType Directory -Path "out" -Force | Out-Null
          Copy-Item -LiteralPath "dist/repoyeti.exe" -Destination "out/repoyeti-windows-x64.exe"
          Compress-Archive -Path "dist/repoyeti.exe" -DestinationPath "out/${{ matrix.asset }}"
          # PowerShell unwraps a one-line command result into a scalar string,
          # where [0] means the first character instead of the first entry.
          $listing = @(tar -tf "out/${{ matrix.asset }}")
          if ($listing.Count -ne 1 -or $listing[0] -ne "repoyeti.exe") {
            throw "archive must contain only repoyeti.exe"
          }
          # A THIRD Windows asset: the same executable plus the misc/ tray toolkit, for anyone who
          # wants the notification-area icon rather than a bare window. RepoYeti draws no tray icon
          # itself - misc/lunarwerx-tray.exe does, as a separate launcher - so without these files a
          # downloaded build simply cannot have one, whatever the app's settings say.
          #
          # Deliberately a SEPARATE asset, so the single-file invariant asserted just above (and the
          # auto-updater that depends on it) is untouched. The updater matches its asset by exact
          # name, so this one can never be picked up by mistake.
          $tray = "repoyeti-windows-x64-with-tray"
          New-Item -ItemType Directory -Path "tmp/$tray/misc" -Force | Out-Null
          Copy-Item -LiteralPath "dist/repoyeti.exe" -Destination "tmp/$tray/"
          $trayFiles = @(
            "lunarwerx-tray.exe", "RepoYeti-Tray.json", "RepoYeti.ico",
            "Create-Shortcut.ps1", "New-TrayShortcut.ps1",
            "Tray-Host.ps1", "RepoYeti-Tray.ps1", "Tray-Launch.vbs"
          )
          foreach ($f in $trayFiles) { Copy-Item -LiteralPath "misc/$f" -Destination "tmp/$tray/misc/" }
          # The toolkit is the entire point of this asset, and a bundle missing it still looks fine,
          # so assert rather than hope.
          foreach ($f in $trayFiles) {
            if (-not (Test-Path -LiteralPath "tmp/$tray/misc/$f" -PathType Leaf)) {
              throw "tray bundle is missing misc/$f"
            }
          }
          Compress-Archive -Path "tmp/$tray" -DestinationPath "out/$tray.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    name: publish release
    # Only a TAG publishes. A workflow_dispatch on a branch is a build + smoke validation
    # of the pipeline; dispatching on a tag ref still lands here and publishes for real.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Build checksums
        shell: bash
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum |
            sed -E 's#  artifacts/[^/]+/#  #' > SHA256SUMS.txt
      # The release page gets the changelog entry for this tag, not just a compare link.
      # `generate_release_notes` alone summarises the COMMITS in the range, and this repo ships
      # one squashed commit per release, so on its own it produced a body containing nothing but
      # "Full Changelog: compare/...". It still runs (appended below the body) for that link.
      # A tag with no matching CHANGELOG section fails the release rather than publishing an
      # empty one — shipping binaries nobody has notes for is the thing worth catching here.
      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" --repo "$GITHUB_REPOSITORY" > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
