name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build a complete runnable bundle on
# each OS and publish it to a GitHub Release. The compiled daemon expects the built PWA (and may
# use optional native Lore libraries) beside it, so each asset is an archive of the full `dist/`
# tree rather than a bare executable that starts without its dashboard.
#
# NOTE: arch labels below are nominal (ubuntu→x64, macos-latest→arm64). Adjust the matrix /
# `bun build --compile --target` in scripts/build.ts if you need additional arch variants.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: repoyeti-linux-x64.tar.gz
          - os: macos-latest
            asset: repoyeti-macos-arm64.tar.gz
          - os: windows-latest
            asset: repoyeti-windows-x64.zip
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
      - name: Package complete Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f dist/repoyeti
          test -f dist/web/dist/index.html
          mkdir -p stage/RepoYeti out
          cp -a dist/. stage/RepoYeti/
          bun run scripts/smoke-release.ts stage/RepoYeti
          tar -C stage -czf "out/${{ matrix.asset }}" RepoYeti
          listing="$(tar -tzf "out/${{ matrix.asset }}")"
          grep -qx 'RepoYeti/repoyeti' <<<"$listing"
          grep -qx 'RepoYeti/web/dist/index.html' <<<"$listing"
          grep -q '^RepoYeti/web/dist/assets/' <<<"$listing"
      - name: Package complete Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/repoyeti.exe" -PathType Leaf)) {
            throw "no compiled binary found at dist/repoyeti.exe"
          }
          if (-not (Test-Path -LiteralPath "dist/web/dist/index.html" -PathType Leaf)) {
            throw "no built dashboard found at dist/web/dist/index.html"
          }
          New-Item -ItemType Directory -Path "stage/RepoYeti", "out" -Force | Out-Null
          Copy-Item -Path "dist/*" -Destination "stage/RepoYeti" -Recurse
          bun run scripts/smoke-release.ts stage/RepoYeti
          Compress-Archive -Path "stage/RepoYeti" -DestinationPath "out/${{ matrix.asset }}"
          $listing = tar -tf "out/${{ matrix.asset }}"
          if ($listing -notcontains "RepoYeti/repoyeti.exe") {
            throw "archive is missing RepoYeti/repoyeti.exe"
          }
          if ($listing -notcontains "RepoYeti/web/dist/index.html") {
            throw "archive is missing RepoYeti/web/dist/index.html"
          }
          if (-not ($listing | Where-Object { $_ -like "RepoYeti/web/dist/assets/*" })) {
            throw "archive is missing built dashboard assets"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # needed for CHANGELOG.md — the notes are built from it
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # The release page gets the changelog entry for this tag, not just a compare link.
      # `generate_release_notes` alone summarises the COMMITS in the range, and this repo ships
      # one squashed commit per release, so on its own it produced a body containing nothing but
      # "Full Changelog: compare/...". It still runs (appended below the body) for that link.
      # A tag with no matching CHANGELOG section fails the release rather than publishing an
      # empty one — shipping binaries nobody has notes for is the thing worth catching here.
      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" --repo "$GITHUB_REPOSITORY" > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
