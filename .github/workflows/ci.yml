name: CI

on:
  push:
    branches: [main]
  pull_request:

  # Manual runs, so a commit can be verified without a dummy push. Added 2026-08-06 during a
  # GitHub Actions incident whose recovery plan was to throttle webhook triggers: pushes landed on
  # main and produced no run at all, leaving nothing to gate a release on.
  workflow_dispatch:

jobs:
  daemon:
    name: daemon (test + typecheck)
    # The shipped artifact is a per-OS `bun --compile` binary, so run the suite on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # pin so a Bun upgrade can't silently change the build
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check # ApiErrorCode drift guard + architectural boundary guard
      # Some hosted runners ship without a global git identity; annotated tags (and commits
      # without an explicit identity) need a tagger/committer, so set one for the suite.
      - name: Configure a git identity
        shell: bash
        run: |
          git config --global user.name "RepoYeti CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: bun run check:coverage # runs the suite with coverage + an overall-% floor
      # Advisory by design: an upstream CVE published overnight must not turn the branch red on its
      # own. `|| true` rather than continue-on-error, because continue-on-error still posts a FAILED
      # annotation onto an otherwise-green run, and a red mark nobody can act on is how you learn to
      # scroll past red. The findings are in this step's log either way. bash, not the Windows
      # default pwsh, where `true` is not a command.
      - name: Dependency advisories (advisory only, never fails the run)
        shell: bash
        run: bun audit || true

  web:
    name: web (i18n + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-web-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-web-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run i18n:check # fail on untranslated strings / missing keys / locale parity drift
      # The root job audits root deps only, so web/ went unscanned entirely — and web/ is the half
      # that takes untrusted input: dompurify and marked render README and commit-message markdown
      # from arbitrary cloned repos. Found dompurify pinned at exactly the version an XSS advisory
      # covers (GHSA-55q2-fjhq-7xh7) on 2026-08-14, sitting there unreported. Advisory-only, to
      # match the root step: an upstream CVE landing overnight should not turn the branch red on
      # its own, it should be visible.
      - name: Dependency advisories (advisory only, never fails the run)
        shell: bash
        run: bun audit || true
      - run: bun run test # Vitest: pure-lib units + component render + store smoke (no server needed)
      - run: bun run build # vue-tsc type-check + production bundle (re-runs i18n:check)
      # The Playwright SSE E2E (test:e2e) is intentionally NOT in CI — it needs a live daemon + a
      # registered repo + a browser binary. Run it locally: start the daemon + `bun run dev`, then
      # `bunx playwright install chromium && bun run test:e2e`.
